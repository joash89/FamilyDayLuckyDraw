<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c5ce7" />
  <title>幸运姓名大转盘</title>
  <style>
    :root {
      --ink: #2d2a4a;
      --purple: #6c5ce7;
      --purple-dark: #4b3fbd;
      --yellow: #ffd93d;
      --pink: #ff6b9d;
      --mint: #45d6a8;
      --shadow: 0 12px 0 rgba(45, 42, 74, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.78) 0 34px, transparent 35px),
        radial-gradient(circle at 88% 12%, rgba(255,255,255,.72) 0 28px, transparent 29px),
        radial-gradient(circle at 72% 88%, rgba(255,255,255,.68) 0 42px, transparent 43px),
        linear-gradient(145deg, #dff5ff 0%, #f7e8ff 52%, #fff2c7 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      opacity: .45;
    }

    body::before {
      width: 260px;
      height: 260px;
      left: -90px;
      bottom: -80px;
      background: #74d7ff;
    }

    body::after {
      width: 300px;
      height: 300px;
      right: -110px;
      top: -100px;
      background: #ff9fc1;
    }

    .app-shell {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 18px 22px;
      background: rgba(255,255,255,.88);
      border: 3px solid var(--ink);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    
    .brand-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 6px 0 rgba(45,42,74,.14);
      padding: 8px;
      overflow: hidden;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      border-radius: 10px;
    }

    .hub {
      position: absolute;
      z-index: 5;
      width: 22%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid var(--ink);
      box-shadow: 0 8px 0 rgba(45,42,74,.2);
      user-select: none;
      padding: 12px;
      overflow: hidden;
    }

    .hub img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      border-radius: 50%;
    }

    .footer {
      margin-top: 18px;
      padding: 12px 18px;
      text-align: center;
      font-weight: 800;
      color: #4f4a69;
      background: rgba(255,255,255,.88);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 8px 0 rgba(45,42,74,.12);
    }


    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.45rem);
      line-height: 1;
    }

    .subtitle {
      margin: 7px 0 0;
      font-size: .95rem;
      color: #5c587a;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: #e9fff7;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(45,42,74,.12);
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(310px, 400px) minmax(0, 1fr);
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      background: rgba(255,255,255,.92);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .control-panel {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 1.18rem;
    }

    .count-pill {
      padding: 7px 10px;
      background: #efeaff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-weight: 800;
      font-size: .85rem;
    }

    .hint {
      margin: -4px 0 0;
      color: #67627f;
      font-size: .9rem;
      line-height: 1.55;
    }

    textarea {
      width: 100%;
      min-height: 310px;
      resize: vertical;
      padding: 15px 16px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      outline: none;
      background: #fffdf7;
      color: var(--ink);
      font: 700 .98rem/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
      box-shadow: inset 0 -4px 0 rgba(45,42,74,.06);
    }

    textarea:focus {
      box-shadow: 0 0 0 5px rgba(108,92,231,.16), inset 0 -4px 0 rgba(45,42,74,.06);
    }


    .upload-box {
      padding: 14px;
      background: #eefaff;
      border: 2px dashed #5b7fa8;
      border-radius: 16px;
    }

    .upload-box.dragging {
      background: #dcf7ff;
      border-color: var(--purple);
      box-shadow: 0 0 0 5px rgba(108,92,231,.12);
    }

    .upload-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 900;
      color: var(--purple-dark);
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #ffffff;
      border: 2px solid var(--ink);
      border-radius: 12px;
      font: 700 .88rem "Microsoft YaHei", "PingFang SC", sans-serif;
      cursor: pointer;
    }

    .upload-hint {
      margin: 9px 0 0;
      color: #67627f;
      font-size: .82rem;
      line-height: 1.45;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 3px solid var(--ink);
      border-radius: 15px;
      padding: 12px 14px;
      font: 900 .96rem/1 "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(45,42,74,.16);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.03);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(45,42,74,.16);
    }

    button:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(45,42,74,.16);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-primary { background: var(--mint); }
    .btn-secondary { background: #e9e6ff; }
    .btn-danger { background: #ffd9df; }

    .btn-spin {
      width: 100%;
      min-height: 58px;
      font-size: 1.2rem;
      background: linear-gradient(180deg, #ffe66d 0%, #ffd43b 100%);
      border-radius: 18px;
      letter-spacing: .08em;
    }

    .option-box {
      display: grid;
      gap: 10px;
      padding: 14px;
      background: #f7f4ff;
      border: 2px dashed #7169a0;
      border-radius: 16px;
    }

    .check-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      font-weight: 800;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--purple);
    }

    .message {
      min-height: 22px;
      margin: 0;
      font-size: .88rem;
      font-weight: 800;
      color: #655f7c;
    }

    .message.error { color: #c83244; }

    .wheel-panel {
      min-height: 670px;
      padding: 22px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.9), rgba(255,255,255,.62)),
        linear-gradient(160deg, #eefaff, #fff6e2);
    }

    .wheel-stage {
      width: min(100%, 700px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      padding: 30px;
    }

    .wheel-shadow {
      position: absolute;
      inset: 8% 7% 4%;
      border-radius: 50%;
      background: rgba(45,42,74,.18);
      filter: blur(15px);
      transform: translateY(22px);
    }

    .wheel-frame {
      width: 100%;
      height: 100%;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      filter: drop-shadow(0 14px 0 rgba(45,42,74,.18));
    }

    .pointer {
      position: absolute;
      z-index: 6;
      top: 1px;
      left: 50%;
      width: 72px;
      height: 88px;
      transform: translateX(-50%);
      transform-origin: 50% 10%;
      pointer-events: none;
      filter: drop-shadow(0 7px 0 rgba(45,42,74,.2));
    }

    .pointer::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 21px;
      transform: translateX(-50%);
      border-left: 27px solid transparent;
      border-right: 27px solid transparent;
      border-top: 59px solid var(--pink);
    }

    .pointer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 42px;
      height: 42px;
      transform: translateX(-50%);
      background: var(--yellow);
      border: 4px solid var(--ink);
      border-radius: 50%;
    }

    .pointer.tick { animation: pointerTick .12s ease-out; }

    @keyframes pointerTick {
      0% { transform: translateX(-50%) rotate(0deg); }
      45% { transform: translateX(-50%) rotate(-12deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    .hub {
      position: absolute;
      z-index: 5;
      width: 22%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffbe2 0 16%, #ffd93d 17% 68%, #f5b800 69% 100%);
      border: 5px solid var(--ink);
      box-shadow: 0 8px 0 rgba(45,42,74,.2);
      font-size: clamp(1.6rem, 5vw, 3.2rem);
      user-select: none;
    }

    .result-strip {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 7;
      transform: translateX(-50%);
      width: min(88%, 540px);
      padding: 12px 16px;
      text-align: center;
      background: rgba(255,255,255,.94);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 7px 0 rgba(45,42,74,.14);
      font-weight: 900;
    }

    .result-strip span { color: var(--purple-dark); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(45,42,74,.48);
      backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      width: min(480px, 100%);
      padding: 28px;
      text-align: center;
      background: #fffdf4;
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 14px 0 rgba(45,42,74,.2);
      transform: scale(.86);
      transition: transform .25s cubic-bezier(.2,1.5,.5,1);
    }

    .modal.show .modal-card { transform: scale(1); }

    .trophy {
      font-size: 68px;
      line-height: 1;
    }

    .modal-card h2 {
      margin: 12px 0 8px;
      font-size: 1.2rem;
      color: #686181;
      letter-spacing: .1em;
    }

    .winner-name {
      margin: 0 0 20px;
      overflow-wrap: anywhere;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
      color: var(--purple-dark);
    }

    .modal-card button {
      min-width: 150px;
      background: var(--mint);
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 40;
      width: 11px;
      height: 18px;
      border: 2px solid rgba(45,42,74,.35);
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--turn));
        opacity: .9;
      }
    }

    
    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
    }

    .brand-icon {
      display: none !important;
    }

    .hub {
      position: absolute;
      z-index: 5;
      width: 22%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffbe2 0 16%, #ffd93d 17% 68%, #f5b800 69% 100%);
      border: 5px solid var(--ink);
      box-shadow: 0 8px 0 rgba(45,42,74,.2);
      user-select: none;
      padding: 0;
      overflow: hidden;
    }

    .hub-text {
      font-size: clamp(1.8rem, 4.2vw, 3rem);
      font-weight: 900;
      color: #4b3fbd;
      line-height: 1;
      letter-spacing: .08em;
      transform: translateX(.05em);
    }

    .footer {
      margin-top: 18px;
      padding: 8px 14px;
      text-align: center;
      font-weight: 700;
      font-size: .78rem;
      color: #5a5574;
      background: rgba(255,255,255,.88);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 6px 0 rgba(45,42,74,.10);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .footer-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      object-position: center center;
      display: block;
      flex: 0 0 auto;
    }

    .footer-text {
      font-size: .78rem;
      line-height: 1.2;
      white-space: nowrap;
    }


    
    .hub {
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .hub:hover:not(:disabled) {
      filter: brightness(1.03);
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(45,42,74,.2);
    }

    .hub:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 4px 0 rgba(45,42,74,.2);
    }

    .hub:disabled {
      cursor: not-allowed;
      opacity: .72;
    }

    .hub:focus-visible {
      outline: 4px solid rgba(85, 194, 255, .55);
      outline-offset: 2px;
    }


    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .wheel-panel { order: 1; min-height: auto; }
      .control-panel { order: 2; }
      textarea { min-height: 240px; }
    }

    @media (max-width: 560px) {
      .app-shell { width: min(100% - 16px, 1240px); padding-top: 10px; }
      .header { align-items: flex-start; padding: 15px; border-radius: 20px; }
      .status-badge { display: none; }
      .brand-icon { display: none !important; }
      .panel { border-radius: 22px; }
      .control-panel, .wheel-panel { padding: 15px; }
      .wheel-stage { padding: 24px 8px 45px; }
      .pointer { top: -5px; transform: translateX(-50%) scale(.84); }
      .result-strip { bottom: 2px; font-size: .88rem; }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>

  <style>
    /* V8 enhancement: center DRAW button enlarged by 100% */
    .hub {
      width: 44% !important;
      border-width: 7px !important;
    }

    .hub-text {
      font-size: clamp(3.6rem, 8.4vw, 6rem) !important;
      font-weight: 900 !important;
    }

    @media (max-width: 560px) {
      .hub {
        width: 44% !important;
        border-width: 5px !important;
      }

      .hub-text {
        font-size: clamp(2.7rem, 11vw, 4.8rem) !important;
      }
    }
  </style>

</head>
<body>
  <main class="app-shell">
    <header class="header">
      <div class="brand">
        <div>
          <h1>幸运姓名大转盘</h1>
          
        </div>
      </div>
      <div class="status-badge" id="headerCount">8 个名字已准备</div>
    </header>

    <section class="main-grid">
      <aside class="panel control-panel">
        <div class="panel-title">
          <h2>📝 姓名名单</h2>
          <span class="count-pill" id="nameCount">8 / 300</span>
        </div>

        <p class="hint">
          每行输入一个名字，也可以使用逗号或分号分隔。系统会自动删除空白项目和重复名字，最多支持 300 人。
        </p>

        <div class="upload-box">
          <label class="upload-label" for="fileInput">📂 上传或拖放 Excel / CSV 名单</label>
          <input id="fileInput" type="file" accept=".csv,.xlsx" />
          <p class="upload-hint">支持 Excel（.xlsx）及 CSV。系统会自动识别“姓名 / 名字 / Name”栏，最多 300 个名字。</p>
        </div>

        <textarea id="nameInput" spellcheck="false" aria-label="姓名名单"></textarea>

        <div class="button-row">
          <button class="btn-primary" id="updateBtn" type="button">更新转盘</button>
          <button class="btn-secondary" id="shuffleBtn" type="button">随机排序</button>
        </div>

        <div class="button-row">
          <button class="btn-secondary" id="sampleBtn" type="button">载入名单</button>
          <button class="btn-danger" id="clearBtn" type="button">清空名单</button>
        </div>

        <div class="option-box">
          <label class="check-line">
            <input id="removeWinner" type="checkbox" />
            每次抽选后自动移除获选者
          </label>
          <label class="check-line">
            <input id="soundToggle" type="checkbox" checked />
            播放转盘及 Hooray 庆祝音效
          </label>
        </div>

        <button class="btn-spin" id="spinBtn" type="button">✨ 开始转动 ✨</button>
        <p class="message" id="message" aria-live="polite">准备开始。</p>
      </aside>

      <section class="panel wheel-panel">
        <div class="wheel-stage">
          <div class="wheel-shadow"></div>
          <div class="wheel-frame">
            <canvas id="wheelCanvas" width="1200" height="1200"></canvas>
            <button class="hub" id="hubSpinBtn" type="button" aria-label="开始转动"><span class="hub-text">抽</span></button>
            <div class="pointer" id="pointer"></div>
          </div>

          <div class="result-strip">
            本次获选：<span id="lastWinner">等待第一次转动……</span>
          </div>
        </div>
      </section>
    </section>

</script>
  <script>
    (() => {
      "use strict";

      const MAX_NAMES = 300;
      const canvas = document.getElementById("wheelCanvas");
      const ctx = canvas.getContext("2d");
      const input = document.getElementById("nameInput");
      const hubSpinBtn = document.getElementById("hubSpinBtn");
      const fileInput = document.getElementById("fileInput");
      const updateBtn = document.getElementById("updateBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const sampleBtn = document.getElementById("sampleBtn");
      const clearBtn = document.getElementById("clearBtn");
      const spinBtn = document.getElementById("spinBtn");
      const removeWinner = document.getElementById("removeWinner");
      const soundToggle = document.getElementById("soundToggle");
      const nameCount = document.getElementById("nameCount");
      const headerCount = document.getElementById("headerCount");
      const message = document.getElementById("message");
      const pointer = document.getElementById("pointer");
      const lastWinner = document.getElementById("lastWinner");
      const winnerModal = document.getElementById("winnerModal");
      const winnerHoorayAudio = document.getElementById("winnerHoorayAudio");
      const winnerName = document.getElementById("winnerName");
      const closeModalBtn = document.getElementById("closeModalBtn");

      const palette = [
        "#ff6b9d", "#6c5ce7", "#45d6a8", "#55c2ff",
        "#ffd93d", "#ff9f43", "#8e7dff", "#34c3a0",
        "#ff7f7f", "#4da3ff", "#c86dd7", "#7bd389"
      ];

      let names = [];
      let rotation = 0;
      let spinning = false;
      let audioContext = null;
      let lastTickSegment = -1;


      function parseNames(raw) {
        const items = raw
          .split(/[\n,，;；]+/)
          .map(name => name.trim())
          .filter(Boolean);

        const seen = new Set();

        return items.filter(name => {
          const key = name.toLocaleLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        }).slice(0, MAX_NAMES);
      }

      function secureRandomInt(max) {
        if (max <= 0) return 0;

        if (window.crypto && crypto.getRandomValues) {
          const array = new Uint32Array(1);
          const limit = Math.floor(0x100000000 / max) * max;
          let value;

          do {
            crypto.getRandomValues(array);
            value = array[0];
          } while (value >= limit);

          return value % max;
        }

        return Math.floor(Math.random() * max);
      }

      function normalize(angle) {
        const twoPi = Math.PI * 2;
        return ((angle % twoPi) + twoPi) % twoPi;
      }

      function fitText(text, maxWidth, maxFontSize, minFontSize = 5) {
        let fontSize = maxFontSize;

        while (fontSize > minFontSize) {
          ctx.font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
          if (ctx.measureText(text).width <= maxWidth) break;
          fontSize -= 1;
        }

        return fontSize;
      }

      function truncateText(text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) return text;

        let result = text;
        while (result.length > 1 && ctx.measureText(result + "…").width > maxWidth) {
          result = result.slice(0, -1);
        }

        return result + "…";
      }

      function drawWheel() {
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) * 0.455;

        ctx.clearRect(0, 0, width, height);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius + 26, 0, Math.PI * 2);
        ctx.fillStyle = "#2d2a4a";
        ctx.fill();

        if (names.length === 0) {
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.fillStyle = "#f1edff";
          ctx.fill();

          ctx.fillStyle = "#5d587a";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = '900 44px "Microsoft YaHei", sans-serif';
          ctx.fillText("请先输入姓名", centerX, centerY - 20);
          ctx.font = '700 28px "Microsoft YaHei", sans-serif';
          ctx.fillText("最少需要 2 个不同名字", centerX, centerY + 35);
          return;
        }

        const arc = (Math.PI * 2) / names.length;
        const maxFont = names.length <= 30 ? 34 :
                        names.length <= 60 ? 22 :
                        names.length <= 120 ? 14 :
                        names.length <= 200 ? 10 : 8;

        const textRadius = radius * 0.70;
        const maxTextWidth = names.length <= 60 ? radius * 0.44 :
                             names.length <= 120 ? radius * 0.32 :
                             names.length <= 200 ? radius * 0.25 :
                             radius * 0.19;

        names.forEach((name, index) => {
          const start = rotation - Math.PI / 2 + index * arc;
          const end = start + arc;

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = palette[index % palette.length];
          ctx.fill();

          ctx.lineWidth = names.length > 150 ? 0.7 : names.length > 80 ? 1.2 : 3;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          ctx.translate(centerX, centerY);
          ctx.rotate(start + arc / 2);

          const fontSize = fitText(name, maxTextWidth, maxFont, 5);
          ctx.font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
          const displayName = truncateText(name, maxTextWidth);

          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(45,42,74,.85)";
          ctx.shadowBlur = names.length > 150 ? 1 : 3;
          ctx.fillText(displayName, textRadius, 0);
          ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.lineWidth = 12;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius + 16, 0, Math.PI * 2);
        ctx.lineWidth = 14;
        ctx.strokeStyle = "#ffd93d";
        ctx.stroke();
      }

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle("error", isError);
      }

      function updateCount() {
        nameCount.textContent = `${names.length} / ${MAX_NAMES}`;
        headerCount.textContent = `${names.length} 个名字已准备`;
        spinBtn.disabled = spinning || names.length < 2;
        if (hubSpinBtn) hubSpinBtn.disabled = spinning || names.length < 2;
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {
          // Some browsers restrict localStorage for locally opened files.
        }
      }

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function saveState() {
        safeStorageSet("luckyWheelNamesZh300", input.value);
        safeStorageSet("luckyWheelRemoveWinnerZh300", String(removeWinner.checked));
        safeStorageSet("luckyWheelSoundZh300", String(soundToggle.checked));
      }

      function updateWheel(showFeedback = true) {
        const originalCount = input.value
          .split(/[\n,，;；]+/)
          .map(name => name.trim())
          .filter(Boolean).length;

        names = parseNames(input.value);
        input.value = names.join("\n");
        rotation = normalize(rotation);

        updateCount();
        drawWheel();
        saveState();

        if (showFeedback) {
          if (names.length < 2) {
            setMessage("请输入至少两个不同的名字。", true);
          } else if (originalCount > MAX_NAMES) {
            setMessage(`名单超过上限，系统已保留前 ${MAX_NAMES} 个名字。`, true);
          } else {
            setMessage(`转盘已更新，共有 ${names.length} 个名字。`);
          }
        }
      }

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = secureRandomInt(i + 1);
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function tickSound() {
        if (!soundToggle.checked) return;

        try {
          if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }

          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "square";
          oscillator.frequency.value = 520;
          gain.gain.setValueAtTime(0.025, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.035);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.04);
        } catch (_) {}
      }

      function triggerPointerTick() {
        pointer.classList.remove("tick");
        void pointer.offsetWidth;
        pointer.classList.add("tick");
        tickSound();
      }





      function playWinnerSound() {
        if (!soundToggle.checked || !winnerHoorayAudio) return;

        try {
          winnerHoorayAudio.pause();
          winnerHoorayAudio.currentTime = 0;
          winnerHoorayAudio.volume = 1.0;

          const playPromise = winnerHoorayAudio.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(() => {
              // Some browsers may block media playback until user interaction.
            });
          }
        } catch (_) {
          // Winner sound is optional if the browser blocks playback.
        }
      }


      function easeOutQuint(t) {
        return 1 - Math.pow(1 - t, 5);
      }

      function createConfetti() {
        const colors = ["#ff6b9d", "#6c5ce7", "#45d6a8", "#55c2ff", "#ffd93d", "#ff9f43"];

        for (let i = 0; i < 90; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${secureRandomInt(101)}vw`;
          piece.style.background = colors[secureRandomInt(colors.length)];
          piece.style.borderRadius = secureRandomInt(2) ? "3px" : "50%";
          piece.style.setProperty("--drift", `${secureRandomInt(241) - 120}px`);
          piece.style.setProperty("--turn", `${secureRandomInt(1200) - 600}deg`);
          piece.style.animationDuration = `${2.2 + Math.random() * 1.8}s`;
          piece.style.animationDelay = `${Math.random() * .45}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4700);
        }
      }

      function showWinner(name, selectedIndex) {
        lastWinner.textContent = name;
        winnerName.textContent = name;
        winnerModal.classList.add("show");
        createConfetti();
        playWinnerSound();
        closeModalBtn.focus();

        if (removeWinner.checked) {
          names.splice(selectedIndex, 1);
          input.value = names.join("\n");
          saveState();
          setMessage(`${name} 已获选，并从下一轮名单中移除。`);
        } else {
          setMessage(`${name} 已获选。`);
        }
      }

      function closeModal() {
        winnerModal.classList.remove("show");

        if (removeWinner.checked) {
          updateCount();
          drawWheel();

          if (names.length < 2) {
            setMessage("请增加更多名字后再开始下一轮。", true);
          }
        }
      }

      function spinWheel() {
        if (spinning) return;

        updateWheel(false);

        if (names.length < 2) {
          setMessage("请输入至少两个不同的名字。", true);
          return;
        }

        spinning = true;
        updateCount();
        setMessage("转盘正在转动……");

        const selectedIndex = secureRandomInt(names.length);
        const arc = (Math.PI * 2) / names.length;
        const currentNormalized = normalize(rotation);
        const desiredNormalized = normalize(-(selectedIndex + 0.5) * arc);
        const alignmentDelta = normalize(desiredNormalized - currentNormalized);
        const fullSpins = 7 + secureRandomInt(4);
        const startRotation = rotation;
        const targetRotation = rotation + fullSpins * Math.PI * 2 + alignmentDelta;
        const duration = 4800 + secureRandomInt(900);
        const startTime = performance.now();

        lastTickSegment = -1;

        function animate(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeOutQuint(progress);

          rotation = startRotation + (targetRotation - startRotation) * eased;
          drawWheel();

          const tickSegment = Math.floor(normalize(rotation) / arc);
          if (tickSegment !== lastTickSegment && progress < 0.985) {
            lastTickSegment = tickSegment;
            triggerPointerTick();
          }

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            rotation = normalize(targetRotation);
            drawWheel();
            spinning = false;
            updateCount();
            showWinner(names[selectedIndex], selectedIndex);
          }
        }

        requestAnimationFrame(animate);
      }


      function normalizeHeader(value) {
        return String(value ?? "")
          .trim()
          .toLocaleLowerCase()
          .replace(/[\s_\-\/]+/g, " ");
      }

      function isNameHeader(value) {
        const header = normalizeHeader(value);
        const exactHeaders = new Set([
          "name", "names", "full name", "participant name", "participant names",
          "姓名", "名字", "姓名名单", "参与者姓名", "参赛者姓名", "学员姓名",
          "员工姓名", "nama", "nama peserta", "nama penuh"
        ]);

        return exactHeaders.has(header) ||
          header.includes("姓名") ||
          header === "participant" ||
          header === "participants";
      }

      function isNumericOnly(value) {
        return /^[+\-]?[\d\s,，.]+$/.test(String(value).trim());
      }

      function selectNameColumn(rows) {
        const searchableRows = Math.min(rows.length, 10);
        let maxColumns = 0;

        rows.forEach(row => {
          if (Array.isArray(row)) maxColumns = Math.max(maxColumns, row.length);
        });

        for (let rowIndex = 0; rowIndex < searchableRows; rowIndex++) {
          const row = rows[rowIndex] || [];

          for (let columnIndex = 0; columnIndex < row.length; columnIndex++) {
            if (isNameHeader(row[columnIndex])) {
              return { columnIndex, startRow: rowIndex + 1, detectedByHeader: true };
            }
          }
        }

        if (maxColumns <= 1) {
          return { columnIndex: 0, startRow: 0, detectedByHeader: false };
        }

        let bestColumn = 0;
        let bestScore = -Infinity;

        for (let columnIndex = 0; columnIndex < maxColumns; columnIndex++) {
          let score = 0;
          let nonEmpty = 0;
          let textLike = 0;
          let numeric = 0;
          const distinct = new Set();

          rows.slice(0, 300).forEach(row => {
            const value = String((row || [])[columnIndex] ?? "").trim();
            if (!value) return;

            nonEmpty++;
            distinct.add(value.toLocaleLowerCase());

            if (isNumericOnly(value)) {
              numeric++;
              score -= 4;
            } else if (/[@]|https?:\/\/|www\./i.test(value)) {
              score -= 3;
            } else if (/[\p{L}\u3400-\u9fff]/u.test(value)) {
              textLike++;
              score += 5;
            } else {
              score += 1;
            }
          });

          const firstValue = normalizeHeader((rows[0] || [])[columnIndex]);
          if (/^(id|no|no\.|number|编号|序号|号码)$/.test(firstValue)) score -= 25;
          if (isNameHeader(firstValue)) score += 50;
          if (nonEmpty > 0 && numeric / nonEmpty > 0.75) score -= 30;
          score += Math.min(distinct.size, 40) * 0.15;
          score += textLike * 0.25;

          if (score > bestScore) {
            bestScore = score;
            bestColumn = columnIndex;
          }
        }

        return { columnIndex: bestColumn, startRow: 0, detectedByHeader: false };
      }

      function cleanImportedRows(rows) {
        const normalizedRows = (rows || []).filter(row =>
          Array.isArray(row) && row.some(value => String(value ?? "").trim() !== "")
        );

        if (normalizedRows.length === 0) return [];

        const { columnIndex, startRow } = selectNameColumn(normalizedRows);
        const seen = new Set();
        const imported = [];

        for (let rowIndex = startRow; rowIndex < normalizedRows.length; rowIndex++) {
          const value = String(normalizedRows[rowIndex][columnIndex] ?? "").trim();
          if (!value || isNameHeader(value)) continue;

          const key = value.toLocaleLowerCase();
          if (seen.has(key)) continue;

          seen.add(key);
          imported.push(value);
          if (imported.length >= MAX_NAMES) break;
        }

        return imported;
      }

      function parseCsvText(text) {
        const cleanText = text.replace(/^\uFEFF/, "");
        const rows = [];
        let row = [];
        let current = "";
        let inQuotes = false;

        for (let i = 0; i < cleanText.length; i++) {
          const char = cleanText[i];

          if (char === '"') {
            if (inQuotes && cleanText[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if ((char === "," || char === "，" || char === "\t" || char === ";" || char === "；") && !inQuotes) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (char === "\r" && cleanText[i + 1] === "\n") i++;
            row.push(current);
            if (row.some(value => String(value).trim() !== "")) rows.push(row);
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        row.push(current);
        if (row.some(value => String(value).trim() !== "")) rows.push(row);
        return rows;
      }

      function decodeXml(value) {
        return String(value ?? "")
          .replace(/&#(x?[0-9a-fA-F]+);/g, (_, code) => {
            const number = code[0].toLowerCase() === "x"
              ? parseInt(code.slice(1), 16)
              : parseInt(code, 10);
            return Number.isFinite(number) ? String.fromCodePoint(number) : "";
          })
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&amp;/g, "&");
      }

      function getTagBlocks(xml, tagName) {
        const prefix = "(?:[A-Za-z_][\\w.-]*:)?";
        const expression = new RegExp(
          `<${prefix}${tagName}\\b[\\s\\S]*?<\\/${prefix}${tagName}>`,
          "g"
        );
        return String(xml || "").match(expression) || [];
      }

      function getTagTexts(xml, tagName) {
        const prefix = "(?:[A-Za-z_][\\w.-]*:)?";
        const expression = new RegExp(
          `<${prefix}${tagName}\\b[^>]*>([\\s\\S]*?)<\\/${prefix}${tagName}>`,
          "g"
        );
        const values = [];
        let match;

        while ((match = expression.exec(String(xml || "")))) {
          values.push(match[1]);
        }

        return values;
      }

      function columnIndexFromReference(reference) {
        const match = String(reference || "").match(/^[A-Z]+/i);
        if (!match) return -1;

        return match[0]
          .toUpperCase()
          .split("")
          .reduce((sum, character) => sum * 26 + character.charCodeAt(0) - 64, 0) - 1;
      }

      function parseSharedStrings(xml) {
        return getTagBlocks(xml, "si").map(item =>
          getTagTexts(item, "t").map(decodeXml).join("")
        );
      }

      function parseWorksheetXml(xml, sharedStrings) {
        const rows = [];
        const cellExpression = /<(?:[A-Za-z_][\w.-]*:)?c\b[^>]*(?:\/>|>[\s\S]*?<\/(?:[A-Za-z_][\w.-]*:)?c>)/g;

        getTagBlocks(xml, "row").forEach(rowXml => {
          const row = [];
          const cells = rowXml.match(cellExpression) || [];

          cells.forEach(cellXml => {
            const openingTag =
              cellXml.match(/^<(?:[A-Za-z_][\w.-]*:)?c\b([^>]*)>/) ||
              cellXml.match(/^<(?:[A-Za-z_][\w.-]*:)?c\b([^>]*)\/>/);
            const attributes = openingTag ? openingTag[1] : "";
            const reference = (attributes.match(/\br="([^"]+)"/) || [])[1] || "";
            const columnIndex = columnIndexFromReference(reference);
            if (columnIndex < 0) return;

            const type = (attributes.match(/\bt="([^"]+)"/) || [])[1] || "";
            let value = "";

            if (type === "inlineStr") {
              value = getTagTexts(cellXml, "t").map(decodeXml).join("");
            } else {
              const rawValues = getTagTexts(cellXml, "v");
              if (rawValues.length) {
                value = type === "s"
                  ? (sharedStrings[Number(rawValues[0])] ?? "")
                  : decodeXml(rawValues[0]);
              }
            }

            row[columnIndex] = String(value).trim();
          });

          if (row.some(value => String(value ?? "").trim() !== "")) rows.push(row);
        });

        return rows;
      }

      function normalizeZipPath(target) {
        if (target.startsWith("/")) return target.replace(/^\//, "");

        const parts = (`xl/${target}`).split("/");
        const stack = [];

        parts.forEach(part => {
          if (!part || part === ".") return;
          if (part === "..") stack.pop();
          else stack.push(part);
        });

        return stack.join("/");
      }

      async function parseXlsxFile(file) {
        if (typeof JSZip === "undefined") {
          throw new Error("Excel 读取组件未能启动。");
        }

        const zip = await JSZip.loadAsync(await file.arrayBuffer());
        const workbookEntry = zip.file("xl/workbook.xml");
        const relationshipsEntry = zip.file("xl/_rels/workbook.xml.rels");

        if (!workbookEntry || !relationshipsEntry) {
          throw new Error("这不是有效的 XLSX 文件。");
        }

        const workbookXml = await workbookEntry.async("string");
        const relationshipsXml = await relationshipsEntry.async("string");
        const firstSheetTag =
          (workbookXml.match(/<(?:[A-Za-z_][\w.-]*:)?sheet\b[^>]*>/) || [])[0] || "";
        const relationshipId =
          (firstSheetTag.match(/\br:id="([^"]+)"/) || [])[1] || "";

        if (!relationshipId) {
          throw new Error("Excel 文件内没有可读取的工作表。");
        }

        let worksheetTarget = "";
        const relationshipTags =
          relationshipsXml.match(/<Relationship\b[^>]*\/?>(?:<\/Relationship>)?/g) || [];

        relationshipTags.some(tag => {
          const id = (tag.match(/\bId="([^"]+)"/) || [])[1] || "";
          if (id !== relationshipId) return false;
          worksheetTarget = (tag.match(/\bTarget="([^"]+)"/) || [])[1] || "";
          return true;
        });

        const worksheetPath = normalizeZipPath(worksheetTarget);
        const worksheetEntry = zip.file(worksheetPath);
        if (!worksheetEntry) throw new Error("无法读取 Excel 的第一个工作表。");

        const sharedEntry = zip.file("xl/sharedStrings.xml");
        const sharedStrings = sharedEntry
          ? parseSharedStrings(await sharedEntry.async("string"))
          : [];

        return parseWorksheetXml(
          await worksheetEntry.async("string"),
          sharedStrings
        );
      }

      async function importNameFile(file) {
        const extension = file.name.split(".").pop().toLowerCase();
        let rows = [];

        setMessage(`正在读取 ${file.name}……`);

        try {
          if (extension === "csv") {
            rows = parseCsvText(await file.text());
          } else if (extension === "xlsx") {
            rows = await parseXlsxFile(file);
          } else if (extension === "xls") {
            throw new Error("旧版 .xls 暂不支持，请在 Excel 中另存为 .xlsx 或 CSV。");
          } else {
            throw new Error("请选择 Excel（.xlsx）或 CSV 文件。");
          }

          const importedNames = cleanImportedRows(rows);
          if (importedNames.length === 0) {
            throw new Error("文件内没有找到可用的姓名。请确认姓名位于同一栏。 ");
          }

          input.value = importedNames.join("\n");
          updateWheel(false);
          setMessage(`已从 ${file.name} 成功载入 ${names.length} 个名字。`);
        } catch (error) {
          console.error(error);
          setMessage(error.message || "名单文件读取失败。", true);
        } finally {
          fileInput.value = "";
        }
      }

      fileInput.addEventListener("change", event => {
        const file = event.target.files && event.target.files[0];
        if (file) importNameFile(file);
      });

      const uploadBox = document.querySelector(".upload-box");

      ["dragenter", "dragover"].forEach(eventName => {
        uploadBox.addEventListener(eventName, event => {
          event.preventDefault();
          uploadBox.classList.add("dragging");
        });
      });

      ["dragleave", "drop"].forEach(eventName => {
        uploadBox.addEventListener(eventName, event => {
          event.preventDefault();
          uploadBox.classList.remove("dragging");
        });
      });

      uploadBox.addEventListener("drop", event => {
        const file = event.dataTransfer && event.dataTransfer.files[0];
        if (file) importNameFile(file);
      });

      updateBtn.addEventListener("click", () => updateWheel(true));

      shuffleBtn.addEventListener("click", () => {
        updateWheel(false);

        if (names.length < 2) {
          setMessage("请先输入至少两个名字。", true);
          return;
        }

        shuffleArray(names);
        input.value = names.join("\n");
        rotation = 0;
        drawWheel();
        saveState();
        setMessage("名单已随机排序。");
      });

      sampleBtn.addEventListener("click", () => {
        fileInput.click();
      });

      clearBtn.addEventListener("click", () => {
        input.value = "";
        names = [];
        rotation = 0;
        updateCount();
        drawWheel();
        saveState();
        lastWinner.textContent = "等待第一次转动……";
        setMessage("名单已清空，请输入至少两个名字。", true);
        input.focus();
      });

      spinBtn.addEventListener("click", spinWheel);
      if (hubSpinBtn) hubSpinBtn.addEventListener("click", spinWheel);
      closeModalBtn.addEventListener("click", closeModal);

      winnerModal.addEventListener("click", event => {
        if (event.target === winnerModal) closeModal();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && winnerModal.classList.contains("show")) {
          closeModal();
        }
      });

      removeWinner.addEventListener("change", saveState);
      soundToggle.addEventListener("change", saveState);

      input.addEventListener("input", () => {
        const previewCount = parseNames(input.value).length;
        nameCount.textContent = `${previewCount} / ${MAX_NAMES}`;
      });

      const savedNames = safeStorageGet("luckyWheelNamesZh300");
      if (savedNames !== null) input.value = savedNames;

      removeWinner.checked =
        safeStorageGet("luckyWheelRemoveWinnerZh300") === "true";

      soundToggle.checked =
        safeStorageGet("luckyWheelSoundZh300") !== "false";

      updateWheel(false);
      setMessage(
        names.length >= 2 ? "准备开始。" : "请输入至少两个名字。",
        names.length < 2
      );
    })();
  </script>
</body>
</html>
